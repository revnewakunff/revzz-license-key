<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>REVZZ - PROFIL</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#080000;color:#fff;min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#120505;border-bottom:1px solid #dc262633;position:sticky;top:0;z-index:99}.btn{width:36px;height:36px;background:#000;border:1px solid #dc262633;border-radius:8px;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}.side{position:fixed;top:61px;left:0;width:250px;height:calc(100% - 61px);background:#0f0404;border-right:1px solid #dc262633;padding:16px;transform:translateX(-100%);transition:.3s;z-index:98;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto}.side.show{transform:translateX(0)}.side a{display:flex;gap:10px;padding:12px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:8px;text-decoration:none;color:#fff;cursor:pointer;transition:.2s}.side a.menu{background:#000;border:1px solid #ffffff0d}.side a.active{background:#dc2626!important;border:1px solid #dc2626!important;color:#fff!important}.owner-box{padding:12px;background:#000;border-radius:12px;border:1px solid #ffffff0d;margin-top:12px}.overlay{position:fixed;top:61px;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;z-index:97}.overlay.show{display:block}.box{background:#120505;border:1px solid #dc262633;border-radius:14px;padding:16px;margin:12px}.label{font-size:10px;color:#ffffff59;letter-spacing:1.8px;font-weight:800;margin:12px 0 6px}.input{width:100%;background:#000;border:1px solid #dc262633;border-radius:12px;padding:13px;font-size:13px;color:#fff;outline:none}.input-wrap{position:relative}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:14px;color:#ffffff66}</style></head><body><div class="header"><button class="btn" onclick="toggle()">☰</button><b style="letter-spacing:3px;font-size:14px">REVZZ <span style="color:#dc2626">PANEL</span></b><span style="font-size:11px;background:#000;border:1px solid #dc26264d;color:#ef4444;padding:4px 10px;border-radius:20px;font-weight:900" id="totalKeys">0</span></div><div id="side" class="side"><div><a href="dashboard.html" class="menu">📊 DASHBOARD</a><a href="createkey.html" class="menu">➕ CREATE KEY</a><a href="adduser.html" id="menu-adduser" class="menu">👤 ADD USER</a><a href="profil.html" class="active">⚙️ PROFIL</a><a href="#" onclick="logout();return false;" class="menu" style="margin-top:20px;color:#ef4444;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.25)">🚪 Logout</a></div><div class="owner-box"><p style="font-size:10px;color:#ffffff4d;letter-spacing:3px">USER</p><p style="font-weight:900;margin-top:4px;font-size:16px" id="ownerName">revzz</p><p style="font-size:12px;color:#ef4444;font-weight:900;margin-top:2px" id="ownerRole">DEWA</p></div></div><div id="ov" class="overlay" onclick="toggle()"></div><div class="box"><p style="font-weight:900;font-size:13px">PROFIL USER</p><p class="label">USERNAME</p><input id="pUser" value="revzz" disabled class="input" style="color:#ef4444;font-weight:900"><p class="label">ROLE</p><input id="pRole" value="DEWA" disabled class="input" style="color:#ef4444;font-weight:900"><p class="label">DURATION</p><input value="PERMANENT" disabled class="input" style="color:#22c55e;font-weight:900"><p class="label">PASSWORD</p><div class="input-wrap"><input id="ownerPass" type="password" value="revzz123" class="input" style="color:#fff;font-weight:700"><span class="eye" onclick="togglePass('ownerPass',this)">👁️</span></div></div><script>
// ===== FULL FIX AUTO-KICK REVZZ =====
if(localStorage.getItem('revzz_login')!=='true'){location.href='index.html';}
function checkAkunValid(){
  let cur=JSON.parse(localStorage.getItem('revzz_user')||'{}');
  if(cur.role==='DEWA') return;
  let users=JSON.parse(localStorage.getItem('ks_users')||'[]');
  let masihAda=users.find(x=>x.user===cur.user);
  let isDeleted=localStorage.getItem('deleted_'+cur.user);
  if(!masihAda || isDeleted){
    localStorage.clear();
    location.href='index.html?deleted=1';
  }
}
checkAkunValid();
setInterval(checkAkunValid,2000);
function logout(){
  localStorage.removeItem('revzz_login');
  localStorage.removeItem('revzz_user');
  location.href='index.html';
}
// ===== END AUTO-KICK =====
function toggle(){document.getElementById('side').classList.toggle('show');document.getElementById('ov').classList.toggle('show')}
function togglePass(id,el){let i=document.getElementById(id);if(i.type==='password'){i.type='text';el.innerText='🙈';}else{i.type='password';el.innerText='👁️';}}
function loadKeys(){let keys=JSON.parse(localStorage.getItem('ks_keys')||'[]');document.getElementById('totalKeys').innerText=keys.length;}
let cur=JSON.parse(localStorage.getItem('revzz_user')||'{"user":"revzz","role":"DEWA"}');
let users=JSON.parse(localStorage.getItem('ks_users')||'[]');
let real=users.find(x=>x.user===cur.user);
document.getElementById('ownerName').innerText=cur.user;
document.getElementById('ownerRole').innerText=cur.role;
document.getElementById('pUser').value=cur.user;
document.getElementById('pRole').value=cur.role;
if(cur.user==='revzz'){document.getElementById('ownerPass').value='revzz123';}else{document.getElementById('ownerPass').value=real?real.pass:'';}
if(cur.role!=='DEWA'){document.getElementById('menu-adduser').style.display='none';}
loadKeys();
</script></body></html>
