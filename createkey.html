<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>REVZZ - CREATE KEY ONLINE</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#080000;color:#fff;min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#120505;border-bottom:1px solid #dc262633;position:sticky;top:0;z-index:99}.btn{width:36px;height:36px;background:#000;border:1px solid #dc262633;border-radius:8px;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}.side{position:fixed;top:61px;left:0;width:250px;height:calc(100% - 61px);background:#0f0404;border-right:1px solid #dc262633;padding:16px;transform:translateX(-100%);transition:.3s;z-index:98;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto}.side.show{transform:translateX(0)}.side a{display:flex;gap:10px;padding:12px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:8px;text-decoration:none;color:#fff;cursor:pointer;transition:.2s}.side a.menu{background:#000;border:1px solid #ffffff0d}.side a.active{background:#dc2626!important;border:1px solid #dc2626!important;color:#fff!important}.owner-box{padding:12px;background:#000;border-radius:12px;border:1px solid #ffffff0d;margin-top:12px}.overlay{position:fixed;top:61px;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;z-index:97}.overlay.show{display:block}.box{background:#120505;border:1px solid #dc262633;border-radius:14px;padding:16px;margin:12px}.label{font-size:10px;color:#ffffff59;letter-spacing:1.8px;font-weight:800;margin:12px 0 6px}.input{width:100%;background:#000;border:1px solid #dc262633;border-radius:12px;padding:13px;font-size:13px;color:#fff;outline:none;text-transform:uppercase;letter-spacing:1px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.suf{position:relative}.suf span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:#ffffff59;font-weight:900;pointer-events:none}.btn-red{width:100%;background:#dc2626;border:none;border-radius:12px;padding:14px;font-weight:900;letter-spacing:1px;margin-top:16px;color:#fff;cursor:pointer}#status{font-size:12px;text-align:center;margin-top:10px;color:#22c55e;display:none}</style></head><body><div class="header"><button class="btn" onclick="toggle()">☰</button><b style="letter-spacing:3px;font-size:14px">REVZZ <span style="color:#dc2626">PANEL</span></b><span style="font-size:11px;background:#000;border:1px solid #dc26264d;color:#ef4444;padding:4px 10px;border-radius:20px;font-weight:900" id="totalKeys">0</span></div><div id="side" class="side"><div><a href="dashboard.html" class="menu">DASHBOARD</a><a href="createkey.html" class="active">CREATE KEY</a><a href="adduser.html" id="menu-adduser" class="menu">ADD USER</a><a href="profil.html" class="menu">PROFIL</a><a href="#" onclick="logout();return false;" class="menu" style="margin-top:20px;color:#ef4444;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.25)">Logout</a></div><div class="owner-box"><p style="font-size:10px;color:#ffffff4d;letter-spacing:3px">USER</p><p style="font-weight:900;margin-top:4px;font-size:16px" id="ownerName">revzz</p><p style="font-size:12px;color:#ef4444;font-weight:900;margin-top:2px" id="ownerRole">DEWA</p></div></div><div id="ov" class="overlay" onclick="toggle()"></div><div class="box"><p style="font-weight:900;font-size:13px">CREATE NEW KEY - ONLINE MODE</p><p class="label">NAME KEY</p><input id="keyName" class="input" placeholder="REVZ-XXXX-XXXX-XXXX (kosongkan = auto)"><div class="grid2"><div><p class="label">DURATION KEY</p><div class="suf"><input id="dur" type="number" min="1" value="1" class="input"><span>DAY</span></div></div><div><p class="label">LIMIT DEVICE</p><div class="suf"><input id="max" type="number" min="1" value="1" class="input"><span>DEVICE</span></div></div></div><button id="btnCreate" onclick="createKey()" class="btn-red">CREATE KEY</button><p id="status"></p></div><script>
const DB_URL = "https://revzz-license-key-default-rtdb.firebaseio.com/keys";
if(localStorage.getItem('revzz_login')!=='true'){location.href='index.html';}
function toggle(){document.getElementById('side').classList.toggle('show');document.getElementById('ov').classList.toggle('show')}
function logout(){localStorage.removeItem('revzz_login');localStorage.removeItem('revzz_user');location.href='index.html';}
async function loadKeys(){
  try{
    const r = await fetch(DB_URL+".json");
    const data = await r.json();
    let count = data ? Object.keys(data).length : 0;
    document.getElementById('totalKeys').innerText=count;
  }catch(e){ document.getElementById('totalKeys').innerText="0"; }
}

// === FIX GENERATE KEY JADI REVZ-ZXXX-XXXX-XXXX ===
function generateREVZKey(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O,I,0,1 biar clean
  const rand4 = () => {
    let s="";
    for(let i=0;i<4;i++) s+=chars.charAt(Math.floor(Math.random()*chars.length));
    return s;
  };
  return `REVZ-${rand4()}-${rand4()}-${rand4()}`;
}

// Auto format input kayak login tadi
document.getElementById('keyName').addEventListener('input', (e)=>{
  let v = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');
  e.target.value = v;
});

async function createKey(){
  const btn = document.getElementById('btnCreate');
  const status = document.getElementById('status');
  btn.innerText="SEDANG MEMBUAT..."; btn.disabled=true;

  let n=document.getElementById('keyName').value.trim().toUpperCase();
  if(n===""){
    n = generateREVZKey(); // <--- JADI REVZ-VAJA-JSKH-KAHS
  }
  
  let dVal=parseInt(document.getElementById('dur').value)||1;
  let mVal=parseInt(document.getElementById('max').value)||1;
  try{
    const res = await fetch(DB_URL + "/" + n + ".json", {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({key:n,duration:dVal+' Day',durationDay:dVal,max:mVal,devicesUsed:0,deviceList:[],created:Date.now(),status:"active",createdBy:JSON.parse(localStorage.getItem('revzz_user')||'{}').user || 'revzz'})
    });
    if(res.ok){
      status.style.display="block";
      status.innerText="✅ Key "+n+" berhasil! Sudah bisa dipakai di APK/Script/Link";
      setTimeout(()=>{ window.location.href='dashboard.html'; }, 1200);
    } else { throw new Error("Gagal simpan"); }
  }catch(err){
    alert("Gagal konek Firebase! "+err.message);
    btn.innerText="CREATE KEY"; btn.disabled=false;
  }
}
let cur=JSON.parse(localStorage.getItem('revzz_user')||'{}');
document.getElementById('ownerName').innerText=cur.user||'revzz';
document.getElementById('ownerRole').innerText=cur.role||'DEWA';
if(cur.role!=='DEWA')document.getElementById('menu-adduser').style.display='none';
loadKeys();
</script></body></html>
