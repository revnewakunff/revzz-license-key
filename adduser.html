<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>REVZZ - ADD USER</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#080000;color:#fff;min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#120505;border-bottom:1px solid #dc262633;position:sticky;top:0;z-index:99}.btn{width:36px;height:36px;background:#000;border:1px solid #dc262633;border-radius:8px;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}.side{position:fixed;top:61px;left:0;width:250px;height:calc(100% - 61px);background:#0f0404;border-right:1px solid #dc262633;padding:16px;transform:translateX(-100%);transition:.3s;z-index:98;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto}.side.show{transform:translateX(0)}.side a{display:flex;gap:10px;padding:12px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:8px;text-decoration:none;color:#fff;cursor:pointer;transition:.2s}.side a.menu{background:#000;border:1px solid #ffffff0d}.side a.active{background:#dc2626!important;border:1px solid #dc2626!important;color:#fff!important}.owner-box{padding:12px;background:#000;border-radius:12px;border:1px solid #ffffff0d;margin-top:12px}.overlay{position:fixed;top:61px;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;z-index:97}.overlay.show{display:block}.box{background:#120505;border:1px solid #dc262633;border-radius:14px;padding:16px;margin:12px}.label{font-size:10px;color:#ffffff59;letter-spacing:1.8px;font-weight:800;margin:12px 0 6px}.input{width:100%;background:#000;border:1px solid #dc262633;border-radius:12px;padding:13px;font-size:13px;color:#fff;outline:none}.input-wrap{position:relative}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:14px;color:#ffffff66}.btn-red{width:100%;background:#dc2626;border:none;border-radius:12px;padding:14px;font-weight:900;letter-spacing:1px;margin-top:16px;color:#fff;cursor:pointer}</style></head><body><div class="header"><button class="btn" onclick="toggle()">☰</button><b style="letter-spacing:3px;font-size:14px">REVZZ <span style="color:#dc2626">PANEL</span></b><span style="font-size:11px;background:#000;border:1px solid #dc26264d;color:#ef4444;padding:4px 10px;border-radius:20px;font-weight:900" id="totalKeys">0</span></div><div id="side" class="side"><div><a href="dashboard.html" class="menu">📊 DASHBOARD</a><a href="createkey.html" class="menu">➕ CREATE KEY</a><a href="adduser.html" class="active">👤 ADD USER</a><a href="profil.html" class="menu">⚙️ PROFIL</a><a href="#" onclick="logout();return false;" class="menu" style="margin-top:20px;color:#ef4444;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.25)">🚪 Logout</a></div><div class="owner-box"><p style="font-size:10px;color:#ffffff4d;letter-spacing:3px">USER</p><p style="font-weight:900;margin-top:4px;font-size:16px">revzz</p><p style="font-size:12px;color:#ef4444;font-weight:900;margin-top:2px">DEWA</p></div></div><div id="ov" class="overlay" onclick="toggle()"></div><div class="box"><p style="font-weight:900;font-size:13px">ADD NEW USER</p><p class="label">USERNAME</p><input id="uName" class="input" placeholder="USERNAME USER"><p class="label">PASSWORD</p><div class="input-wrap"><input id="uPass" type="password" class="input" placeholder="PASSWORD USER"><span class="eye" onclick="togglePass('uPass',this)">👁️</span></div><p class="label">ROLE</p><select id="uRole" class="input"><option>RESELLER</option><option>ADMIN</option><option>DEWA</option></select><button onclick="addUser()" class="btn-red">ADD USER</button></div><div id="listUser"></div><script>
// ===== FULL FIX AUTO-KICK + LOGOUT ANTI 404 =====
if(localStorage.getItem('revzz_login')!=='true'){location.href='index.html';}
let curLogin=JSON.parse(localStorage.getItem('revzz_user')||'{}');
if(curLogin.role!=='DEWA'){location.href='dashboard.html';}
function checkAkunValid(){
  let cur=JSON.parse(localStorage.getItem('revzz_user')||'{}');
  if(cur.role==='DEWA') return;
  let users=JSON.parse(localStorage.getItem('ks_users')||'[]');
  let masihAda=users.find(x=>x.user===cur.user);
  let isDeleted=localStorage.getItem('deleted_'+cur.user);
  if(!masihAda || isDeleted){
    localStorage.clear();
    location.href='index.html?deleted=1';
  }
}
checkAkunValid();
setInterval(checkAkunValid,2000);
function logout(){
  localStorage.removeItem('revzz_login');
  localStorage.removeItem('revzz_user');
  location.href='index.html';
}
// ===== END FIX =====
function toggle(){document.getElementById('side').classList.toggle('show');document.getElementById('ov').classList.toggle('show')}
function togglePass(id,el){let i=document.getElementById(id);if(i.type==='password'){i.type='text';el.innerText='🙈';}else{i.type='password';el.innerText='👁️';}}
function loadKeys(){let keys=JSON.parse(localStorage.getItem('ks_keys')||'[]');document.getElementById('totalKeys').innerText=keys.length;}
function addUser(){
  let u=document.getElementById('uName').value.trim();
  let p=document.getElementById('uPass').value.trim();
  let r=document.getElementById('uRole').value;
  if(!u||!p){alert('Isi username & password');return}
  let us=JSON.parse(localStorage.getItem('ks_users')||'[]');
  if(us.find(x=>x.user===u)){alert('User sudah ada!');return;}
  us.unshift({user:u,role:r,pass:p});
  localStorage.setItem('ks_users',JSON.stringify(us));
  localStorage.removeItem('deleted_'+u);
  document.getElementById('uName').value='';
  document.getElementById('uPass').value='';
  loadUsers();
  alert('User '+u+' ditambahkan!');
}
function loadUsers(){
  let us=JSON.parse(localStorage.getItem('ks_users')||'[]');
  let l=document.getElementById('listUser');
  if(!us.length){l.innerHTML='<div style="text-align:center;color:#ffffff33;margin-top:20px;font-size:12px">BELUM ADA USER</div>';return}
  let h='<p style="font-weight:900;font-size:11px;margin:12px">LIST USER</p>';
  us.forEach((x,i)=>{h+=`<div class="box" style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:13px;color:#f87171">${x.user}</b><div style="font-size:10px;color:#ffffff66">${x.role} - Pass: ${x.pass}</div></div><button onclick="delUser(${i})" style="background:rgba(220,38,38,.15);color:#ef4444;border:1px solid rgba(220,38,38,.2);border-radius:8px;padding:8px 14px;font-size:11px;font-weight:800;cursor:pointer">Hapus</button></div>`});
  l.innerHTML=h;
}
function delUser(i){
  let us=JSON.parse(localStorage.getItem('ks_users')||'[]');
  let target=us[i];
  if(!confirm('Hapus user '+target.user+'? Akun akan langsung ke tendang dan ga bisa login lagi!')) return;
  localStorage.setItem('deleted_'+target.user,'1');
  us.splice(i,1);
  localStorage.setItem('ks_users',JSON.stringify(us));
  loadUsers();
}
loadKeys();loadUsers();
</script></body></html>
